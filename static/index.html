<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16a34a">
  <title>Каталог — FastMarket</title>
  <link rel="stylesheet" href="/style.css?v=2">
</head>
<body>
  <header id="header"></header>

  <main class="container shop">
    <!-- Каталог -->
    <section class="catalog">
      <div class="search">
        <input type="search" id="search" placeholder="Найти продукты" aria-label="Поиск товара" autocomplete="off">
      </div>
      <div class="chips" id="chips" role="tablist" aria-label="Категории"></div>

      <div id="products" class="products" aria-live="polite"></div>
      <div id="empty" class="empty" hidden>Ничего не нашлось 🤷</div>
    </section>

    <!-- Корзина: справа на десктопе, шторка снизу на телефоне -->
    <aside class="cart" id="cart" aria-label="Корзина">
      <div class="cart-head">
        <h3>Корзина</h3>
        <div class="tools">
          <button class="link" id="clear-cart" hidden>Очистить</button>
          <button class="icon sheet-close" id="cart-close" aria-label="Закрыть корзину">×</button>
        </div>
      </div>

      <div class="cart-empty" id="cart-empty">
        <div class="big">🧺</div>
        Корзина пуста.<br>Добавьте что-нибудь из каталога.
      </div>
      <div class="cart-items" id="cart-items"></div>

      <div class="cart-foot" id="cart-foot" hidden>
        <div class="cart-total"><span>Итого</span><span id="cart-total"></span></div>
        <button class="checkout" id="checkout">Оформить заказ</button>
      </div>
    </aside>
  </main>

  <!-- Мобильная плашка корзины -->
  <button class="cart-bar" id="cart-bar" hidden>
    <span>🛒 <span id="cart-bar-count"></span></span>
    <span><span id="cart-bar-total"></span> →</span>
  </button>
  <div class="backdrop" id="backdrop"></div>

  <!-- Оформление заказа -->
  <dialog class="sheet" id="checkout-dialog" aria-labelledby="checkout-title">
    <form id="checkout-form">
      <h3 id="checkout-title">Оформление заказа</h3>

      <div class="field">
        <label for="addr">Адрес доставки</label>
        <textarea id="addr" rows="2" required minlength="5" maxlength="500"
                  autocomplete="street-address" placeholder="Улица, дом, квартира, подъезд"></textarea>
        <label class="check"><input type="checkbox" id="save-addr" checked> Запомнить адрес</label>
      </div>

      <div class="field">
        <label for="comment">Комментарий курьеру <span style="font-weight:400;color:var(--muted)">— необязательно</span></label>
        <textarea id="comment" rows="2" maxlength="1000" placeholder="Например: домофон не работает, позвоните"></textarea>
      </div>

      <div class="summary" id="summary"></div>

      <div class="dialog-actions">
        <button type="button" class="secondary" id="checkout-cancel">Назад</button>
        <button type="submit" id="place-order">Заказать</button>
      </div>
    </form>
  </dialog>

  <script src="/app.js?v=2"></script>
  <script>
    const $ = (id) => document.getElementById(id);

    let products = [];        // текущая выдача (с фильтрами)
    const byId = new Map();   // все известные товары по id
    let activeCat = "";
    let profileAddress = null;
    let reqSeq = 0;

    // ---------- Заглушки картинок ----------
    const CAT_EMOJI = [
      [/молоч|молок|кефир|йогурт/i, "🥛"], [/хлеб|выпеч/i, "🍞"], [/яйц/i, "🥚"],
      [/фрукт|ягод/i, "🍎"], [/овощ|зелен/i, "🥕"], [/сыр/i, "🧀"],
      [/мяс|птиц|колбас/i, "🥩"], [/рыб|море/i, "🐟"], [/напит|сок|вод/i, "🧃"],
      [/слад|конфет|шокол|десерт/i, "🍫"], [/круп|макар/i, "🌾"], [/заморож/i, "🧊"],
    ];
    function emojiFor(cat) {
      const hit = CAT_EMOJI.find(([re]) => re.test(cat || ""));
      return hit ? hit[1] : "🛒";
    }
    function thumbHtml(p) {
      const e = emojiFor(p.category);
      if (!p.image_url) return e;
      return `<img src="${escapeHtml(p.image_url)}" alt="" loading="lazy"
                   onerror="this.replaceWith('${e}')">`;
    }

    function stepperHtml(id, qty, max, small = false) {
      return `
        <div class="stepper ${small ? "sm" : ""}">
          <button data-act="dec" data-id="${id}" aria-label="Убрать одну штуку">−</button>
          <span>${qty}</span>
          <button data-act="inc" data-id="${id}" aria-label="Добавить ещё" ${qty >= max ? "disabled" : ""}>+</button>
        </div>`;
    }

    // ---------- Каталог ----------
    function showSkeletons(n = 8) {
      const sk = `
        <div class="card skeleton" aria-hidden="true">
          <div class="sk sk-img"></div>
          <div class="sk sk-line"></div>
          <div class="sk sk-line short"></div>
          <div class="sk sk-btn"></div>
        </div>`;
      $("products").innerHTML = sk.repeat(n);
    }

    async function loadProducts() {
      const params = new URLSearchParams();
      const search = $("search").value.trim();
      if (search) params.append("search", search);
      if (activeCat) params.append("category", activeCat);

      const seq = ++reqSeq;
      $("products").classList.add("loading");
      try {
        const data = await api("/products/?" + params.toString());
        if (seq !== reqSeq) return;          // пришёл устаревший ответ — игнорируем
        products = data;
        data.forEach(p => byId.set(p.id, p));
        renderProducts();
      } catch (err) {
        toast(err.message);
      } finally {
        if (seq === reqSeq) $("products").classList.remove("loading");
      }
    }

    // Полный список: категории + сверка корзины с актуальными ценами и остатками
    async function loadAll() {
      try {
        const all = await api("/products/?only_available=false");
        all.forEach(p => byId.set(p.id, p));
        renderChips([...new Set(all.filter(p => p.is_available).map(p => p.category).filter(Boolean))]);
        if (cart.sync(all)) toast("Корзина обновлена: изменились цены или наличие");
        renderCart();
      } catch {}
    }

    function renderChips(cats) {
      const box = $("chips");
      box.innerHTML = "";
      ["", ...cats].forEach(c => {
        const b = document.createElement("button");
        b.className = "chip" + (c === activeCat ? " active" : "");
        b.textContent = c || "Все";
        b.setAttribute("role", "tab");
        b.setAttribute("aria-selected", c === activeCat);
        b.addEventListener("click", () => {
          activeCat = c;
          box.querySelectorAll(".chip").forEach(x => {
            const on = x === b;
            x.classList.toggle("active", on);
            x.setAttribute("aria-selected", on);
          });
          loadProducts();
        });
        box.appendChild(b);
      });
    }

    function cardFootHtml(p) {
      const price = `<span class="price">${fmtPrice(p.price)}</span>`;
      if (p.stock <= 0) return `${price}<button class="add-btn" disabled>Нет в наличии</button>`;
      const q = cart.qty(p.id);
      if (!q) return `${price}<button class="add-btn" data-act="inc" data-id="${p.id}">В корзину</button>`;
      return price + stepperHtml(p.id, q, p.stock);
    }

    function renderProducts() {
      const box = $("products");
      $("empty").hidden = products.length > 0;

      box.innerHTML = products.map(p => `
        <article class="card ${p.stock <= 0 ? "out" : ""}" data-card="${p.id}">
          <div class="card-img">${thumbHtml(p)}</div>
          <div class="cat">${escapeHtml(p.category || "")}</div>
          <h3>${escapeHtml(p.name)}</h3>
          ${p.description ? `<div class="desc">${escapeHtml(p.description)}</div>` : ""}
          ${p.stock > 0 && p.stock <= 5 ? `<div class="low">Осталось ${p.stock} шт.</div>` : ""}
          <div class="card-foot">${cardFootHtml(p)}</div>
        </article>
      `).join("");
    }

    function updateCard(id) {
      const foot = document.querySelector(`[data-card="${id}"] .card-foot`);
      const p = byId.get(id);
      if (foot && p) foot.innerHTML = cardFootHtml(p);
    }

    // ---------- Корзина ----------
    const mobile = window.matchMedia("(max-width: 900px)");

    function openSheet() {
      if (!mobile.matches) return;
      $("cart").classList.add("open");
      $("backdrop").classList.add("show");
      document.body.style.overflow = "hidden";
    }
    function closeSheet() {
      $("cart").classList.remove("open");
      $("backdrop").classList.remove("show");
      document.body.style.overflow = "";
    }

    function renderCart() {
      const items = cart.get();
      const total = cart.total();
      const count = cart.count();
      const has = items.length > 0;

      $("cart-items").innerHTML = items.map(i => `
        <div class="cart-item">
          <div class="thumb">${thumbHtml(i)}</div>
          <div>
            <div class="name" title="${escapeHtml(i.name)}">${escapeHtml(i.name)}</div>
            <div class="sum">${fmtPrice(i.price * i.qty)}</div>
          </div>
          ${stepperHtml(i.id, i.qty, i.stock ?? Infinity, true)}
        </div>
      `).join("");

      $("cart-empty").hidden = has;
      $("cart-foot").hidden = !has;
      $("clear-cart").hidden = !has;
      $("cart-total").textContent = fmtPrice(total);

      $("cart-bar").hidden = !has;
      $("cart-bar-count").textContent = `${count} ${plural(count, "товар", "товара", "товаров")}`;
      $("cart-bar-total").textContent = fmtPrice(total);

      if (!has) closeSheet();
    }

    // Один обработчик на все кнопки «+», «−», «В корзину» — и в каталоге, и в корзине
    document.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-act]");
      if (!btn) return;
      const id = +btn.dataset.id;

      if (btn.dataset.act === "inc") {
        const product = byId.get(id) || cart.get().find(i => i.id === id);
        if (product && !cart.add(product)) toast("Больше нет в наличии");
      } else {
        cart.setQty(id, cart.qty(id) - 1);
      }
      updateCard(id);
      renderCart();
    });

    $("cart-bar").addEventListener("click", openSheet);
    $("cart-close").addEventListener("click", closeSheet);
    $("backdrop").addEventListener("click", closeSheet);
    mobile.addEventListener("change", closeSheet);
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

    $("clear-cart").addEventListener("click", () => {
      if (!confirm("Очистить корзину?")) return;
      cart.clear();
      renderCart();
      renderProducts();
    });

    // ---------- Оформление заказа ----------
    const dlg = $("checkout-dialog");

    function renderSummary() {
      const items = cart.get();
      const total = cart.total();
      $("summary").innerHTML =
        items.map(i => `
          <div class="row">
            <span>${escapeHtml(i.name)} × ${i.qty}</span>
            <span>${fmtPrice(i.price * i.qty)}</span>
          </div>`).join("") +
        `<div class="row total"><span>Итого</span><span>${fmtPrice(total)}</span></div>`;
      $("place-order").textContent = `Заказать за ${fmtPrice(total)}`;
    }

    $("checkout").addEventListener("click", async () => {
      if (!auth.isLoggedIn()) {
        toast("Войдите, чтобы оформить заказ");
        setTimeout(() => location.href = "/login.html", 900);
        return;
      }
      closeSheet();
      renderSummary();

      if (profileAddress === null) {
        try {
          const me = await api("/users/me");
          profileAddress = me.address || "";
        } catch { profileAddress = ""; }
      }
      if (!$("addr").value) $("addr").value = profileAddress;
      $("save-addr").checked = !profileAddress;   // предлагаем запомнить, если адреса ещё нет

      dlg.showModal();
      if (!$("addr").value && !mobile.matches) $("addr").focus();
    });

    $("addr").addEventListener("input", () => {
      $("save-addr").checked = $("addr").value.trim() !== profileAddress;
    });

    $("checkout-cancel").addEventListener("click", () => dlg.close());
    dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); }); // клик по фону

    $("checkout-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const address = $("addr").value.trim();
      const comment = $("comment").value.trim() || null;
      const items = cart.get().map(i => ({ product_id: i.id, quantity: i.qty }));
      if (!items.length) { dlg.close(); return; }

      const btn = $("place-order");
      btn.disabled = true;
      btn.textContent = "Оформляем…";

      try {
        await api("/orders/", {
          method: "POST",
          body: JSON.stringify({ items, delivery_address: address, comment }),
        });

        if ($("save-addr").checked && address !== profileAddress) {
          api("/users/me", { method: "PATCH", body: JSON.stringify({ address }) }).catch(() => {});
        }

        cart.clear();
        dlg.close();
        toast("Заказ оформлен! 🎉");
        setTimeout(() => location.href = "/orders.html", 900);
      } catch (err) {
        toast(err.message);
        btn.disabled = false;
        // Скорее всего, изменился остаток — подтягиваем свежие данные
        await loadAll();
        await loadProducts();
        renderSummary();
        if (!cart.count()) dlg.close();
      }
    });

    // ---------- Поиск ----------
    let t;
    $("search").addEventListener("input", () => {
      clearTimeout(t);
      t = setTimeout(loadProducts, 300);
    });

    // ---------- Старт ----------
    showSkeletons();
    renderCart();
    loadAll();
    loadProducts();
  </script>
</body>
</html>
