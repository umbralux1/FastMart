<!DOCTYPE html>
<html lang="hy" data-title="title.catalog">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16a34a">
  <title>FastMarket</title>
  <link rel="stylesheet" href="/style.css?v=6">
</head>
<body>
  <header id="header"></header>

  <main class="container shop">
    <!-- Каталог -->
    <section class="catalog">
      <div class="search">
        <input type="search" id="search" data-i18n-ph="search.placeholder" data-i18n-aria="search.aria" autocomplete="off">
      </div>
      <div class="chips" id="chips" role="tablist" data-i18n-aria="cats.aria"></div>

      <div id="products" class="products" aria-live="polite"></div>
      <div id="empty" class="empty" hidden data-i18n="catalog.empty"></div>
    </section>

    <!-- Корзина: справа на десктопе, шторка снизу на телефоне -->
    <aside class="cart" id="cart" data-i18n-aria="cart.aria">
      <div class="cart-head">
        <h3 data-i18n="cart.title"></h3>
        <div class="tools">
          <button class="link" id="clear-cart" hidden data-i18n="cart.clear"></button>
          <button class="icon sheet-close" id="cart-close" data-i18n-aria="cart.close">×</button>
        </div>
      </div>

      <div class="eta" id="cart-eta"></div>

      <div class="cart-empty" id="cart-empty">
        <div class="big">🧺</div>
        <div data-i18n-html="cart.empty"></div>
      </div>
      <div class="cart-items" id="cart-items"></div>

      <div class="cart-foot" id="cart-foot" hidden>
        <div class="cart-line"><span data-i18n="cart.subtotal"></span><span id="cart-subtotal"></span></div>
        <div class="cart-line"><span data-i18n="cart.delivery"></span><span id="cart-delivery"></span></div>
        <div class="cart-total"><span data-i18n="cart.total"></span><span id="cart-total"></span></div>
        <button class="checkout" id="checkout" data-i18n="cart.checkout"></button>
      </div>
    </aside>
  </main>

  <!-- Мобильная плашка корзины -->
  <button class="cart-bar" id="cart-bar" hidden>
    <span>🛒 <span id="cart-bar-count"></span></span>
    <span><span id="cart-bar-total"></span> →</span>
  </button>
  <div class="backdrop" id="backdrop"></div>

  <!-- Оформление заказа -->
  <dialog class="sheet" id="checkout-dialog" aria-labelledby="checkout-title">
    <form id="checkout-form" novalidate>
      <h3 id="checkout-title" data-i18n="checkout.title"></h3>

      <div class="field">
        <label for="addr" data-i18n="checkout.address"></label>
        <textarea id="addr" rows="2" required minlength="5" maxlength="500"
                  autocomplete="street-address" data-i18n-ph="checkout.address_ph" aria-describedby="addr-err"></textarea>
        <div class="field-err" id="addr-err" hidden data-i18n="checkout.address_bad"></div>
      </div>

      <div class="field">
        <label for="phone" data-i18n="checkout.phone"></label>
        <div class="phone-input">
          <span class="phone-prefix" aria-hidden="true">+374</span>
          <input id="phone" type="tel" inputmode="tel" autocomplete="tel-national"
                 placeholder="__ ___ ___" aria-describedby="phone-err">
        </div>
        <div class="field-err" id="phone-err" hidden data-i18n="checkout.phone_bad"></div>
        <label class="check"><input type="checkbox" id="save-addr" checked> <span data-i18n="checkout.save_addr"></span></label>
      </div>

      <fieldset class="field pay">
        <legend data-i18n="checkout.payment"></legend>
        <div class="pay-options">
          <label class="pay-option"><input type="radio" name="pay" value="cash" checked> <span data-i18n="pay.cash"></span></label>
          <label class="pay-option"><input type="radio" name="pay" value="card"> <span data-i18n="pay.card"></span></label>
        </div>
      </fieldset>

      <div class="field">
        <label for="comment"><span data-i18n="checkout.comment"></span> <span style="font-weight:400;color:var(--muted)" data-i18n="checkout.optional"></span></label>
        <textarea id="comment" rows="2" maxlength="1000" data-i18n-ph="checkout.comment_ph"></textarea>
      </div>

      <div class="summary" id="summary"></div>

      <div class="dialog-actions">
        <button type="button" class="secondary" id="checkout-cancel" data-i18n="checkout.back"></button>
        <button type="submit" id="place-order"></button>
      </div>
    </form>
  </dialog>

  <script src="/i18n.js?v=6"></script>
  <script src="/app.js?v=6"></script>
  <script>
    const $ = (id) => document.getElementById(id);

    let products = [];        // текущая выдача (с фильтрами)
    const byId = new Map();   // все известные товары по id
    let activeCat = "";
    let profile = null;       // { address, phone } из профиля — для подстановки в форму

    // Настройки магазина (стоимость доставки и т. п.) — с сервера, с запасным значением
    let SHOP = { delivery_fee: 300, delivery_minutes: 15 };
    fetch("/config").then(r => r.ok ? r.json() : null).then(c => {
      if (c) { SHOP = c; renderCart(); }
    }).catch(() => {});
    const orderTotal = () => cart.total() + SHOP.delivery_fee;
    let reqSeq = 0;

    function stepperHtml(id, qty, max, small = false) {
      return `
        <div class="stepper ${small ? "sm" : ""}">
          <button data-act="dec" data-id="${id}" aria-label="${t("stepper.dec")}">−</button>
          <span>${qty}</span>
          <button data-act="inc" data-id="${id}" aria-label="${t("stepper.inc")}" ${qty >= max ? "disabled" : ""}>+</button>
        </div>`;
    }

    // ---------- Каталог ----------
    function showSkeletons(n = 8) {
      const sk = `
        <div class="card skeleton" aria-hidden="true">
          <div class="sk sk-img"></div>
          <div class="sk sk-line"></div>
          <div class="sk sk-line short"></div>
          <div class="sk sk-btn"></div>
        </div>`;
      $("products").innerHTML = sk.repeat(n);
    }

    async function loadProducts() {
      const params = new URLSearchParams();
      const search = $("search").value.trim();
      if (search) params.append("search", search);
      if (activeCat) params.append("category", activeCat);

      const seq = ++reqSeq;
      $("products").classList.add("loading");
      try {
        const data = await api("/products/?" + params.toString());
        if (seq !== reqSeq) return;          // пришёл устаревший ответ — игнорируем
        products = data;
        data.forEach(p => byId.set(p.id, p));
        renderProducts();
      } catch (err) {
        toast(err.message);
      } finally {
        if (seq === reqSeq) $("products").classList.remove("loading");
      }
    }

    // Полный список: категории + сверка корзины с актуальными ценами и остатками
    async function loadAll({ quiet = false } = {}) {
      try {
        const all = await api("/products/?only_available=false");
        all.forEach(p => byId.set(p.id, p));
        // Категория-ключ — русское название (по нему фильтрует API), подпись — на языке интерфейса
        const cats = new Map();
        all.filter(p => p.is_available && p.category)
           .forEach(p => { if (!cats.has(p.category)) cats.set(p.category, loc(p, "category")); });
        renderChips([...cats.entries()]);
        if (cart.sync(all) && !quiet) toast(t("cart.synced"));
        renderCart();
      } catch {}
    }

    // cats: [[ключ, подпись], ...]
    function renderChips(cats) {
      const box = $("chips");
      box.innerHTML = "";
      [["", t("cats.all")], ...cats].forEach(([c, label]) => {
        const b = document.createElement("button");
        b.className = "chip" + (c === activeCat ? " active" : "");
        b.textContent = label;
        b.setAttribute("role", "tab");
        b.setAttribute("aria-selected", c === activeCat);
        b.addEventListener("click", () => {
          activeCat = c;
          box.querySelectorAll(".chip").forEach(x => {
            const on = x === b;
            x.classList.toggle("active", on);
            x.setAttribute("aria-selected", on);
          });
          loadProducts();
        });
        box.appendChild(b);
      });
    }

    function cardFootHtml(p) {
      const price = `<span class="price">${fmtPrice(p.price)}</span>`;
      if (p.stock <= 0) return `${price}<button class="add-btn" disabled>${t("card.out")}</button>`;
      const q = cart.qty(p.id);
      if (!q) return `${price}<button class="add-btn" data-act="inc" data-id="${p.id}">${t("card.add")}</button>`;
      return price + stepperHtml(p.id, q, p.stock);
    }

    function renderProducts() {
      const box = $("products");
      $("empty").hidden = products.length > 0;

      box.innerHTML = products.map(p => `
        <article class="card ${p.stock <= 0 ? "out" : ""}" data-card="${p.id}">
          <div class="card-img">${thumbHtml(p)}</div>
          <div class="cat">${escapeHtml(loc(p, "category"))}</div>
          <h3>${escapeHtml(loc(p, "name"))}</h3>
          ${p.description ? `<div class="desc">${escapeHtml(loc(p, "description"))}</div>` : ""}
          ${p.stock > 0 && p.stock <= 5 ? `<div class="low">${t("card.low", { n: p.stock })}</div>` : ""}
          <div class="card-foot">${cardFootHtml(p)}</div>
        </article>
      `).join("");
    }

    function updateCard(id) {
      const foot = document.querySelector(`[data-card="${id}"] .card-foot`);
      const p = byId.get(id);
      if (foot && p) foot.innerHTML = cardFootHtml(p);
    }

    // ---------- Корзина ----------
    const mobile = window.matchMedia("(max-width: 900px)");

    function openSheet() {
      if (!mobile.matches) return;
      $("cart").classList.add("open");
      $("backdrop").classList.add("show");
      document.body.style.overflow = "hidden";
    }
    function closeSheet() {
      $("cart").classList.remove("open");
      $("backdrop").classList.remove("show");
      document.body.style.overflow = "";
    }

    function renderCart() {
      const items = cart.get();
      const total = cart.total();
      const count = cart.count();
      const has = items.length > 0;

      $("cart-items").innerHTML = items.map(i => `
        <div class="cart-item">
          <div class="thumb">${thumbHtml(i)}</div>
          <div>
            <div class="name" title="${escapeHtml(loc(i, "name"))}">${escapeHtml(loc(i, "name"))}</div>
            <div class="sum">${fmtPrice(i.price * i.qty)}</div>
          </div>
          ${stepperHtml(i.id, i.qty, i.stock ?? Infinity, true)}
        </div>
      `).join("");

      $("cart-empty").hidden = has;
      $("cart-foot").hidden = !has;
      $("clear-cart").hidden = !has;
      $("cart-eta").textContent = t("cart.eta", { min: SHOP.delivery_minutes });
      $("cart-subtotal").textContent = fmtPrice(total);
      $("cart-delivery").textContent = fmtPrice(SHOP.delivery_fee);
      $("cart-total").textContent = fmtPrice(orderTotal());

      $("cart-bar").hidden = !has;
      $("cart-bar-count").textContent = `${count} ${tp("cart.items", count)}`;
      $("cart-bar-total").textContent = fmtPrice(total);

      if (!has) closeSheet();
    }

    // Один обработчик на все кнопки «+», «−», «В корзину» — и в каталоге, и в корзине
    document.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-act]");
      if (!btn) return;
      const id = +btn.dataset.id;

      if (btn.dataset.act === "inc") {
        const product = byId.get(id) || cart.get().find(i => i.id === id);
        if (product && !cart.add(product)) toast(t("cart.no_more"));
      } else {
        cart.setQty(id, cart.qty(id) - 1);
      }
      updateCard(id);
      renderCart();
    });

    $("cart-bar").addEventListener("click", openSheet);
    $("cart-close").addEventListener("click", closeSheet);
    $("backdrop").addEventListener("click", closeSheet);
    mobile.addEventListener("change", closeSheet);
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

    $("clear-cart").addEventListener("click", () => {
      if (!confirm(t("cart.clear_confirm"))) return;
      cart.clear();
      renderCart();
      renderProducts();
    });

    // ---------- Оформление заказа ----------
    const dlg = $("checkout-dialog");

    function renderSummary() {
      const items = cart.get();
      const total = cart.total();
      $("summary").innerHTML =
        items.map(i => `
          <div class="row">
            <span>${escapeHtml(loc(i, "name"))} × ${i.qty}</span>
            <span>${fmtPrice(i.price * i.qty)}</span>
          </div>`).join("") +
        `<div class="row subtotal"><span>${t("cart.subtotal")}</span><span>${fmtPrice(total)}</span></div>` +
        `<div class="row"><span>${t("cart.delivery")}</span><span>${fmtPrice(SHOP.delivery_fee)}</span></div>` +
        `<div class="row total"><span>${t("cart.total")}</span><span>${fmtPrice(orderTotal())}</span></div>`;
      $("place-order").textContent = t("checkout.place", { sum: fmtPrice(orderTotal()) });
    }

    $("checkout").addEventListener("click", async () => {
      if (!auth.isLoggedIn()) {
        toast(t("checkout.login_first"));
        setTimeout(() => location.href = "/login.html", 900);
        return;
      }
      closeSheet();
      renderSummary();

      if (profile === null) {
        try {
          const me = await api("/users/me");
          profile = { address: me.address || "", phone: formatAmLocal(me.phone) };
        } catch { profile = { address: "", phone: "" }; }
      }
      if (!$("addr").value) $("addr").value = profile.address;
      if (!$("phone").value) $("phone").value = profile.phone;
      updateSaveCheckbox();

      dlg.showModal();
      if (!mobile.matches) {
        if (!$("addr").value) $("addr").focus();
        else if (!$("phone").value) $("phone").focus();
      }
    });

    // Предлагаем запомнить, если адрес или телефон отличаются от профиля
    function updateSaveCheckbox() {
      $("save-addr").checked =
        $("addr").value.trim() !== profile.address ||
        amPhoneDigits($("phone").value) !== amPhoneDigits(profile.phone);
    }
    $("addr").addEventListener("input", updateSaveCheckbox);

    // Маска телефона: [+374] 91 234 567
    // Свои сообщения об ошибках вместо всплывашек браузера: те — на языке браузера, а не сайта
    function showFieldError(id, show) {
      $(id + "-err").hidden = !show;
      $(id).classList.toggle("invalid", show);
      $(id).setAttribute("aria-invalid", show);
    }
    const showPhoneError = (show) => showFieldError("phone", show);
    const addressOk = () => $("addr").value.trim().length >= 5;
    $("addr").addEventListener("input", () => { if (addressOk()) showFieldError("addr", false); });
    // Поле принимает что угодно: «91234567», «091 23 45 67», вставленное «+374 91 234567»
    $("phone").addEventListener("input", () => {
      const el = $("phone");
      el.value = formatAmLocal(el.value);
      if (isValidAmPhone(el.value)) showPhoneError(false);
      updateSaveCheckbox();
    });
    $("phone").addEventListener("blur", () => {
      const v = $("phone").value;
      if (amPhoneDigits(v)) showPhoneError(!isValidAmPhone(v));
    });

    $("checkout-cancel").addEventListener("click", () => dlg.close());
    dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); }); // клик по фону

    $("checkout-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const address = $("addr").value.trim();
      const comment = $("comment").value.trim() || null;
      const items = cart.get().map(i => ({ product_id: i.id, quantity: i.qty }));
      if (!items.length) { dlg.close(); return; }

      const badAddr = !addressOk();
      const badPhone = !isValidAmPhone($("phone").value);
      showFieldError("addr", badAddr);
      showPhoneError(badPhone);
      if (badAddr || badPhone) {
        $(badAddr ? "addr" : "phone").focus();
        return;
      }
      const phone = "+374" + amPhoneDigits($("phone").value);
      const payment_method = dlg.querySelector('input[name="pay"]:checked').value;

      const btn = $("place-order");
      btn.disabled = true;
      btn.textContent = t("checkout.placing");

      try {
        await api("/orders/", {
          method: "POST",
          body: JSON.stringify({ items, delivery_address: address, phone, payment_method, comment }),
        });

        if ($("save-addr").checked) {
          api("/users/me", { method: "PATCH", body: JSON.stringify({ address, phone }) }).catch(() => {});
        }

        cart.clear();
        dlg.close();
        toast(t("checkout.done"));
        setTimeout(() => location.href = "/orders.html", 900);
      } catch (err) {
        toast(err.message);
        btn.disabled = false;
        // Скорее всего, изменился остаток — подтягиваем свежие данные
        // (тихо: важнее, чтобы пользователь прочитал ошибку сервера)
        await loadAll({ quiet: true });
        await loadProducts();
        renderSummary();
        if (!cart.count()) dlg.close();
      }
    });

    // ---------- Поиск ----------
    let searchTimer;
    $("search").addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(loadProducts, 300);
    });

    // ---------- Старт ----------
    showSkeletons();
    renderCart();
    loadAll();
    loadProducts();
  </script>
</body>
</html>
