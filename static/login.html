<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Вход — Dark Store</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header id="header"></header>

  <div class="form-box">
    <h2 id="title">Вход</h2>
    <div id="msg" class="msg"></div>

    <form id="form">
      <input type="text"     id="username" placeholder="Имя пользователя" required>
      <input type="password" id="password" placeholder="Пароль" required>

      <div id="register-fields" style="display:none">
        <input type="email" id="email" placeholder="Email">
        <input type="text"  id="full_name" placeholder="ФИО (необязательно)">
        <input type="text"  id="phone" placeholder="Телефон (необязательно)">
        <input type="text"  id="address" placeholder="Адрес доставки (необязательно)">
      </div>

      <button type="submit" id="submitBtn">Войти</button>
    </form>

    <p class="switch">
      <span id="switch-text">Нет аккаунта?</span>
      <a href="#" id="switch-link">Зарегистрироваться</a>
    </p>
  </div>

  <script src="/app.js"></script>
  <script>
    let mode = "login"; // login | register

    const $ = (id) => document.getElementById(id);
    const msg = $("msg");

    function showMsg(text, type = "err") {
      msg.textContent = text;
      msg.className = "msg " + type;
    }
    function clearMsg() { msg.className = "msg"; }

    $("switch-link").addEventListener("click", (e) => {
      e.preventDefault();
      clearMsg();
      mode = mode === "login" ? "register" : "login";
      const isReg = mode === "register";

      $("title").textContent = isReg ? "Регистрация" : "Вход";
      $("submitBtn").textContent = isReg ? "Создать аккаунт" : "Войти";
      $("switch-text").textContent = isReg ? "Уже есть аккаунт?" : "Нет аккаунта?";
      $("switch-link").textContent = isReg ? "Войти" : "Зарегистрироваться";
      $("register-fields").style.display = isReg ? "block" : "none";

      $("email").required = isReg;
    });

    $("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      clearMsg();

      const username = $("username").value.trim();
      const password = $("password").value;

      if (!username || !password) {
        return showMsg("Заполните логин и пароль");
      }

      try {
        if (mode === "register") {
          await api("/users/register", {
            method: "POST",
            body: JSON.stringify({
              username,
              password,
              email: $("email").value.trim(),
              full_name: $("full_name").value.trim() || null,
              phone: $("phone").value.trim() || null,
              address: $("address").value.trim() || null,
            }),
          });
        }

        // Логин (form-data, как требует OAuth2PasswordRequestForm)
        const form = new URLSearchParams();
        form.append("username", username);
        form.append("password", password);

        const res = await fetch("/users/login", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: form,
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || "Неверный логин или пароль");

        auth.setToken(data.access_token);
        showMsg("Успешно! Перенаправляем...", "ok");
        setTimeout(() => location.href = "/", 500);
      } catch (err) {
        showMsg(err.message);
      }
    });
  </script>
</body>
</html>
