<!DOCTYPE html>
<html lang="hy" data-title="title.login">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16a34a">
  <title>FastMarket</title>
  <link rel="stylesheet" href="/style.css?v=5">
</head>
<body>
  <header id="header"></header>

  <div class="form-box">
    <h2 id="title" data-i18n="login.title"></h2>
    <div id="msg" class="msg"></div>

    <form id="form">
      <input type="text"     id="username" autocomplete="username" data-i18n-ph="login.username" required>
      <input type="password" id="password" autocomplete="current-password" data-i18n-ph="login.password" required>

      <div id="register-fields" style="display:none">
        <input type="email" id="email" autocomplete="email" data-i18n-ph="login.email">
        <input type="text"  id="full_name" autocomplete="name" data-i18n-ph="login.full_name">
        <input type="tel"   id="phone" autocomplete="tel" data-i18n-ph="login.phone">
        <input type="text"  id="address" autocomplete="street-address" data-i18n-ph="login.address">
      </div>

      <button type="submit" id="submitBtn" data-i18n="login.submit"></button>
    </form>

    <p class="switch">
      <span id="switch-text" data-i18n="login.no_account"></span>
      <a href="#" id="switch-link" data-i18n="login.to_register"></a>
    </p>
  </div>

  <script src="/i18n.js?v=5"></script>
  <script src="/app.js?v=5"></script>
  <script>
    let mode = "login"; // login | register

    const $ = (id) => document.getElementById(id);
    const msg = $("msg");

    function showMsg(text, type = "err") {
      msg.textContent = text;
      msg.className = "msg " + type;
    }
    function clearMsg() { msg.className = "msg"; }

    $("switch-link").addEventListener("click", (e) => {
      e.preventDefault();
      clearMsg();
      mode = mode === "login" ? "register" : "login";
      const isReg = mode === "register";

      $("title").textContent = t(isReg ? "login.register_title" : "login.title");
      $("submitBtn").textContent = t(isReg ? "login.register_submit" : "login.submit");
      $("switch-text").textContent = t(isReg ? "login.has_account" : "login.no_account");
      $("switch-link").textContent = t(isReg ? "login.to_login" : "login.to_register");
      $("register-fields").style.display = isReg ? "block" : "none";

      $("email").required = isReg;
      $("password").autocomplete = isReg ? "new-password" : "current-password";
    });

    $("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      clearMsg();

      const username = $("username").value.trim();
      const password = $("password").value;

      if (!username || !password) {
        return showMsg(t("login.fill"));
      }

      try {
        if (mode === "register") {
          await api("/users/register", {
            method: "POST",
            body: JSON.stringify({
              username,
              password,
              email: $("email").value.trim(),
              full_name: $("full_name").value.trim() || null,
              phone: $("phone").value.trim() || null,
              address: $("address").value.trim() || null,
            }),
          });
        }

        // Логин (form-data, как требует OAuth2PasswordRequestForm)
        const form = new URLSearchParams();
        form.append("username", username);
        form.append("password", password);

        const res = await fetch("/users/login", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded", "Accept-Language": LANG },
          body: form,
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || t("login.bad"));

        auth.setToken(data.access_token);
        showMsg(t("login.success"), "ok");
        setTimeout(() => location.href = "/", 500);
      } catch (err) {
        showMsg(err.message);
      }
    });
  </script>
</body>
</html>
