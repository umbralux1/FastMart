<!DOCTYPE html>
<html lang="hy" data-title="title.orders">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16a34a">
  <title>FastMarket</title>
  <link rel="stylesheet" href="/style.css?v=4">
</head>
<body>
  <header id="header"></header>

  <div class="container">
    <h2 style="margin-bottom: 20px;" data-i18n="orders.title"></h2>
    <div id="orders"></div>
    <div id="empty" class="empty" style="display:none">
      <span data-i18n="orders.empty"></span><br><br>
      <a href="/" style="color:var(--accent); font-weight:600;" data-i18n="orders.to_catalog"></a>
    </div>
  </div>

  <script src="/i18n.js?v=4"></script>
  <script src="/app.js?v=4"></script>
  <script>
    const $ = (id) => document.getElementById(id);


    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      })[c]);
    }

    async function loadOrders() {
      if (!auth.isLoggedIn()) {
        location.href = "/login.html";
        return;
      }
      try {
        const orders = await api("/orders/my");
        renderOrders(orders);
      } catch (err) {
        toast(err.message);
      }
    }

    function renderOrders(orders) {
      const box = $("orders");
      box.innerHTML = "";
      $("empty").style.display = orders.length ? "none" : "block";

      orders.forEach(o => {
        let items = [];
        try { items = JSON.parse(o.items_json); } catch {}

        const itemsHtml = items.map(i =>
          `<li>${escapeHtml(itemName(i))} × ${i.quantity} — ${fmtPrice(i.line_total)}</li>`
        ).join("");

        const date = fmtDateTime(o.created_at);
        const canCancel = ["pending", "confirmed"].includes(o.status);

        const el = document.createElement("div");
        el.className = "order";
        el.innerHTML = `
          <div class="order-head">
            <span class="order-id">${t("orders.order", { id: o.id })}</span>
            <span class="badge ${o.status}">${t("status." + o.status)}</span>
          </div>
          <ul class="order-items">${itemsHtml}</ul>
          <div style="font-size:13px;color:#6b7280">
            ${t("orders.address")}: ${escapeHtml(o.delivery_address)}<br>
            ${o.comment ? t("orders.comment") + ": " + escapeHtml(o.comment) + "<br>" : ""}
            ${t("orders.created")}: ${date}
          </div>
          <div class="order-foot">
            <span class="order-total">${fmtPrice(o.total_price)}</span>
            ${canCancel ? `<button class="danger" data-id="${o.id}">${t("orders.cancel")}</button>` : ""}
          </div>
        `;

        const cancelBtn = el.querySelector("button.danger");
        if (cancelBtn) {
          cancelBtn.addEventListener("click", async () => {
            if (!confirm(t("orders.cancel_confirm", { id: o.id }))) return;
            try {
              await api(`/orders/${o.id}/cancel`, { method: "PATCH" });
              toast(t("orders.cancelled"));
              loadOrders();
            } catch (err) {
              toast(err.message);
            }
          });
        }

        box.appendChild(el);
      });
    }

    loadOrders();
  </script>
</body>
</html>
